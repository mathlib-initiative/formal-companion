# companions/adam/adapter.yaml -- worked example: the attribution-table convention.
#
# Copy into a workspace as companions/<name>/adapter.yaml and edit `repo`.
# measure_theory carries no book tags in its docstrings; the item -> declaration
# map is an exported artifact produced by a curation pass, and each statement is
# cut from the Lean file the ledger names for it:
#
#   geometry-batch-{a..d}.json  region_id -> item label + PDF page (visually signed off)
#   target-refinement.json      region_id -> formalization_ids (+ key_formalization_ids)
#   source-formalization-ledger.json  id -> {kind, module, file}
#
# Measured against a real attribution-table repo (measure_theory at 9afe70f):
# 390 geometry items, 211 curated entries, 562 rows over 178 items, 414 key rows, 0 missing snippets.
#
# COVERAGE IS BOUNDED BY CURATION. Items with no curated entry are absent (212
# of 390 here), and declarations that exist only as anonymous `example`s are
# absent by construction. `cf extract` reports both numbers; do not read this
# table as "everything this repo formalises".
name: adam
repo: <path to the companion repo>
adapter: attribution_table
granularity: item

# Which SOURCE a row belongs to. This repo names exactly one -- the ledger's
# source block pins sha 64498329 -- so `default` is the whole story and `map` is
# empty. With two, the first matching rule would win and an unmatchable row
# would be an error naming the file, never a silent default.
sources:
  default: tao-measure-gsm126-published
  map: []

# The exported artifacts, repo-relative: measure_theory's layout. Left out, they
# default to attribution/, or to the older pdf-overlay/data/ when only that exists.
#
# `cf export attribution-table` reads the same artifacts and takes the three
# paths that are not fixed by the convention as flags, also repo-relative
# (docs/exporters.md section 1):
#
#   --data-dir attribution                           the directory below
#   --ledger source-formalization-ledger.json        the `ledger` below
#   --official-source attribution/official-source.json
#
# A repo whose layout differs needs those flags, not a new convention.
target_refinement: attribution/target-refinement.json
geometry_glob: "attribution/geometry-batch-*.json"
ledger: source-formalization-ledger.json

# Page anchors come from the overlay geometry, not from the source: the item's
# own region page, converted with the bound source's offset
# (printed page = PDF page - 16). workspace.yaml's sources.<id>.offset wins --
# it was INFERRED from the running heads, at confidence 0.996 over 265 pages --
# and page_offset is the fallback when this adapter is used outside a workspace.
anchor: ledger
page_offset: 16

# The table against the Lean sources it claims to describe. This repo spells
# its statement region both ways -- `section Companions` in some files,
# `namespace Companions` in others -- so both count. An omission whose docstring
# names a book item is unioned in as `provenance: lean_scan`; one under a block
# header that names its item only in prose goes to
# companions/<name>/unattributed.jsonl, which `cf plan-run` stages for every
# worker. `cf extract` names the omissions in a warning.
lean_scan:
  policy: union
  regions: [Companions]
  glob: "**/*.lean"
  exclude:
    - ".lake/**/*.lean"
    - "**/.lake/**/*.lean"

# Every file whose sha must force a re-extract at an unchanged commit. The
# adapter already hashes the exports above and the Lean the statements are cut
# from; list anything else here.
# Without this, a fix that renames a theorem is invisible until the external
# pipeline re-exports, and `cf extract` would replay the pre-fix table.
key_files: []

sorry:
  # This repo has no permanent exercise sorries: a `sorry` in a cut
  # statement is an unfinished gap, and is classified as one.
  exercise_sorry: none

write_policy: read_only
owner: external
validators: []
